version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-builder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-builder}
      POSTGRES_DB: ${POSTGRES_DB:-builder_leads}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builder"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-builder}:${POSTGRES_PASSWORD:-builder}@postgres:5432/${POSTGRES_DB:-builder_leads}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
      - ./assets:/app/assets

  celery-worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: celery -A app.tasks worker -l info -c 4
    working_dir: /app/backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-builder}:${POSTGRES_PASSWORD:-builder}@postgres:5432/${POSTGRES_DB:-builder_leads}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
      - ./assets:/app/assets

  celery-beat:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: celery -A app.tasks beat -l info
    working_dir: /app/backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-builder}:${POSTGRES_PASSWORD:-builder}@postgres:5432/${POSTGRES_DB:-builder_leads}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/frontend/.next

volumes:
  postgres_data:
